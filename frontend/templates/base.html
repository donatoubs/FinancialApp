<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}FinancialApp{% endblock %}</title>

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="FinancialApp">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#16191C">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" href="/static/img/logo.png?v=2">
    <link rel="manifest" href="/static/manifest.json">
    <script>
        // Tema y preferencias antes de pintar (evita un destello del tema equivocado)
        try {
            const p = JSON.parse(localStorage.getItem('financial_prefs') || '{}');
            if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
            if (p.hideAmounts) document.documentElement.classList.add('hide-amounts');
        } catch (e) {}
    </script>

    <!-- Tipografía: Hanken Grotesk (interfaz y cifras tabulares) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=14">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block vendor_scripts %}{% endblock %}
    <script src="/static/js/main.js?v=11"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
