{% extends "base.html" %}

{% block title %}Crear cuenta · FinancialApp{% endblock %}
{% block body_class %}auth{% endblock %}

{% block body %}
<main class="auth-main">
    <p class="auth-brand">FinancialApp</p>
    <form class="auth-panel" id="registerForm">
        <h1>Crear cuenta</h1>
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div class="row g-2 mb-3">
            <div class="col-sm-6">
                <label for="firstName" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="firstName" required minlength="2" maxlength="50" autocomplete="given-name">
            </div>
            <div class="col-sm-6">
                <label for="lastName" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="lastName" required minlength="2" maxlength="50" autocomplete="family-name">
            </div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" required autocomplete="email" inputmode="email">
        </div>
        <div class="mb-3">
            <label for="currency" class="form-label">Moneda</label>
            <select class="form-select" id="currency">
                <option value="USD" selected>USD · Dólar</option>
                <option value="EUR">EUR · Euro</option>
                <option value="COP">COP · Peso colombiano</option>
                <option value="PEN">PEN · Sol peruano</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña <span class="text-muted fw-normal">(mínimo 8 caracteres)</span></label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" required minlength="8" autocomplete="new-password">
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
            </div>
        </div>
        <div class="mb-4">
            <label for="confirmPassword" class="form-label">Repite la contraseña</label>
            <input type="password" class="form-control" id="confirmPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary w-100">Crear cuenta</button>
        <p class="auth-alt">¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
    </form>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
bindPasswordToggle('togglePassword', 'password');

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('submitBtn');
    const password = document.getElementById('password').value;

    if (password !== document.getElementById('confirmPassword').value) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Las contraseñas no coinciden.';
        return;
    }

    alertBox.className = 'alert d-none';
    btn.disabled = true;
    btn.textContent = 'Creando…';
    try {
        const res = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                full_name: `${document.getElementById('firstName').value.trim()} ${document.getElementById('lastName').value.trim()}`,
                email: document.getElementById('email').value.trim(),
                currency_preference: document.getElementById('currency').value,
                password,
            }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(apiError(data, 'No se pudo crear la cuenta.'));
        localStorage.setItem('financial_token', data.token.access_token);
        localStorage.setItem('financial_user', JSON.stringify(data.user));
        window.location.href = '/dashboard';
    } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
    }
});
</script>
{% endblock %}
