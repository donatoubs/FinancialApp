{% extends "base.html" %}

{% block title %}Iniciar sesión · FinancialApp{% endblock %}
{% block body_class %}auth{% endblock %}

{% block body %}
<main class="auth-main">
    <p class="auth-brand">FinancialApp</p>
    <form class="auth-panel" id="loginForm" novalidate>
        <h1>Iniciar sesión</h1>
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" required autocomplete="email" inputmode="email">
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" required autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
            </div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary w-100">Entrar</button>
        <p class="auth-alt">¿Aún no tienes cuenta? <a href="/register">Crear cuenta</a></p>
    </form>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
bindPasswordToggle('togglePassword', 'password');

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('submitBtn');
    alertBox.className = 'alert d-none';
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    try {
        const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
            }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(apiError(data, 'Correo o contraseña incorrectos.'));
        localStorage.setItem('financial_token', data.token.access_token);
        localStorage.setItem('financial_user', JSON.stringify(data.user));
        window.location.href = '/dashboard';
    } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Entrar';
    }
});
</script>
{% endblock %}
