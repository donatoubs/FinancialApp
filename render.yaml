services:
  - type: web
    name: financialapp
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
