services:
  - type: web
    name: financialapp
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render termina HTTPS; así las URLs generadas usan https://
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_DOCS
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
